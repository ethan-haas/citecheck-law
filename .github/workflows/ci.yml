name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Assert no third-party runtime dependencies
        run: |
          python - <<'PY'
          import importlib.metadata as md
          runtime = [r for r in (md.requires("citecheck-law") or []) if "extra ==" not in r]
          assert not runtime, f"must stay stdlib-only, found: {runtime}"
          print("stdlib-only: OK")
          PY

      - name: Tests (pinned totals)
        run: |
          python -m pytest tests/ -q --junitxml=results.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          s = ET.parse("results.xml").getroot()
          s = s.find("testsuite") if s.tag == "testsuites" else s
          got = {k: int(s.get(k, 0)) for k in ("tests", "failures", "errors", "skipped")}
          print(got)
          # Pinned so a test that silently stops running fails the build.
          assert got == {"tests": 250, "failures": 0, "errors": 0, "skipped": 0}, got
          print("pinned totals match")
          PY

      - name: Corpus integrity — every opinion records its provenance
        run: |
          python - <<'PY'
          import json, glob
          files = glob.glob("corpus/store/*.json")
          assert len(files) == 352, len(files)
          reporters, missing = set(), []
          for f in files:
              d = json.load(open(f, encoding="utf-8"))
              reporters.add(d.get("reporter"))
              if not d.get("source_url"):
                  missing.append(f)
          assert not missing, f"opinions with no source_url: {missing[:5]}"
          assert len(reporters) == 36, sorted(reporters)
          # Reporters still under copyright must never enter the corpus.
          banned = {"S. Ct.", "L. Ed.", "L. Ed. 2d"}
          assert not (reporters & banned), reporters & banned
          print(f"corpus OK: {len(files)} opinions, {len(reporters)} reporters, all with source_url")
          PY

      - name: The shipped example still produces its documented verdicts
        run: |
          python -m citecheck verify examples/sample_brief.md --out report.json
          python - <<'PY'
          import json, collections
          r = json.load(open("report.json"))
          counts = dict(collections.Counter(c["verdict"] for c in r["citations"]))
          expected = {"verified": 4, "exists, unsupported": 1,
                      "not found": 2, "cannot verify": 3}
          assert sum(counts.values()) == 10, counts
          assert counts == expected, f"got {counts} expected {expected}"
          # The refusal pair is reported as two separate numbers, never blended.
          assert "refusal_pair" in r, sorted(r)
          print("example verdicts unchanged:", counts)
          PY

      - name: Exit-code contract
        run: |
          set +e
          python -m citecheck verify examples/sample_brief.md >/dev/null 2>&1
          test $? = 0 || { echo "a clean run must exit 0"; exit 1; }
          python -m citecheck verify ./no_such_file.md >/dev/null 2>&1
          test $? != 0 || { echo "a missing input must exit non-zero"; exit 1; }
          set -e
          echo "exit-code contract holds"
